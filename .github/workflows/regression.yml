name: NEXUS regression tests
on:
  pull_request:
  push:
    branches:
      - main
      - fix/no-fabricated-success-20261016
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed regression tests
        run: python -m unittest discover -v -p 'test_*.py'
